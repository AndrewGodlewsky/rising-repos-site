name: Site eval

# Measures the site's pages with Lighthouse, on a phone and on a desktop, and fails when a number is outside
# its limit in evals/site/limits.json or could not be measured. evals/site/README.md says what it measures.
#
# - After each run of "Build and deploy" for a push to main that succeeded, it measures the preview, while
#   that run's commit is still the head of main. A run whose commit is still the head uploaded its pages,
#   because its deploy job uploads only the head of main.
# - Started by hand, it measures the https address it is given.
# - A pull request that changes the eval measures the preview as it stands, with the eval's new code and limits.
#
# The job runs code that the daily data push can change, as the build job does, so it holds no secret, has no
# environment, and can only read the repository. tests/test_site_eval_workflow.py checks each of these.

on:
  workflow_run:
    workflows: [Build and deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      address:
        description: The https address of the page to measure
        required: true
        default: https://preview.risingrepos.pages.dev/
        type: string
  pull_request:
    paths:
      - .github/workflows/site-eval.yml
      - evals/site/**

permissions: {}

jobs:
  measure:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The measurements that follow deploys take turns, and a newer one cancels an older one, whose pages the
    # newer deploy has replaced. A run started by hand or for a pull request waits for nothing.
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && 'site-eval-preview' || format('site-eval-{0}', github.run_id) }}
      cancel-in-progress: true
    env:
      UV_PYTHON: "3.14.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # After a deploy, the deployed commit. Otherwise empty, which checks out the commit the run is for.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Measure
        env:
          # The address given by hand reaches the eval only here, as a variable, and the eval refuses one that
          # is not https.
          SITE_EVAL_ADDRESS: ${{ inputs.address }}
          SITE_EVAL_COMMIT: ${{ github.event.workflow_run.head_sha }}
          # npm resolves Lighthouse and every package it pulls in as the registry stood on the --before date,
          # which is the tree that was checked (evals/site/README.md says how). No package's install script
          # runs. Node and Chrome are the runner image's own.
          SITE_EVAL_LIGHTHOUSE: npm exec --yes --ignore-scripts --before=2026-10-29 --package=lighthouse@13.5.0 -- lighthouse
        run: |
          uv run --locked python -m evals.site.measure --out "$RUNNER_TEMP/site-eval"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-eval
          path: ${{ runner.temp }}/site-eval
          if-no-files-found: ignore
          retention-days: 90

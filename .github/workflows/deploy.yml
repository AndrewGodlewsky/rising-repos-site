name: Build and deploy

# Every pull request and every push to main builds the pages. A push to main
# also uploads them to Cloudflare Pages.
#
# The two jobs are kept apart on purpose. The daily data push can change any
# file in this repository except a workflow, so nothing it can change may run
# in the job that holds the Cloudflare credential:
#
# - build runs the repository's code. It can only read the repository, holds
#   no secret, and hands the pages on as an artifact.
# - deploy never checks out the repository. It downloads the artifact and runs
#   a wrangler whose version is pinned below, so all it runs is named in this
#   file.
#
# tests/test_workflow.py checks each of these. README.md explains them.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  # The Cloudflare Pages branch an upload goes to. It is the project's
  # production branch, main, so each upload becomes the deployment that
  # risingrepos.com serves, and the build leaves the noindex tag out. Until
  # go-live it was "preview", which made a preview deployment at
  # https://preview.risingrepos.pages.dev and left the earlier site in place.
  # Two other workflows and the eval changed their addresses in the same
  # commit as this line. RUNBOOK.md lists every one, and how to put each back.
  PAGES_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-24.04
    # The checks took 7 to 9 minutes on their own on 27 November 2026, and
    # that night two pull requests' builds that ran beside another job passed
    # the 10 minutes this was then, and were cancelled. 20 leaves room for a
    # slow runner and for the tests each feature adds. The owner raised it.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The newest Python 3.14 that this version of uv installs.
      UV_PYTHON: "3.14.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Run the checks
        # The lint, the format, the agents' tests, and the owner's tests. The
        # owner's tests drive the Chrome that the runner's image holds, so no
        # browser is downloaded.
        run: uv run --locked python -m sitework check --suite

      - name: Build the pages
        # Pages for any upload other than production ask search engines not
        # to index them.
        run: |
          if [ "$PAGES_BRANCH" = main ]; then
            uv run --locked python -m sitebuild dist
          else
            uv run --locked python -m sitebuild dist --noindex
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Take the pictures
        # For the owner, who gets them when a feature ships: each kind of page
        # the pull request altered, at a phone's width and at a desktop's. No
        # check reads them. The checkout holds the pull request's commit alone,
        # so the commit it is compared with is fetched first. The repository is
        # public, so git reads it without a credential.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          uv run --locked python -m sitework pictures --base "$BASE" --out pictures

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: pictures
          path: pictures
          # A pull request that alters no page has no picture to keep.
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: deploy
    permissions: {}
    concurrency:
      # Uploads take turns here. GitHub's default lets one deploy job wait,
      # and cancels it when another arrives, so the newest push's could be the
      # one cancelled. queue: max lets up to 100 wait, and cancels none of
      # them. GitHub refuses it beside cancel-in-progress: true.
      group: cloudflare-pages-upload
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Refuse code that would run on Cloudflare
        # Only static files are uploaded: the build job's code can be changed by
        # a data push, so refuse Cloudflare control files, Pages Functions,
        # symlinks, and any file outside the static allowlist (#248).
        run: |
          for forbidden in site/_worker.js site/_redirects site/_routes.json site/_headers site/functions; do
            if [ -e "$forbidden" ] || [ -L "$forbidden" ]; then
              echo "::error::The build made $forbidden. Only static files are uploaded."
              exit 1
            fi
          done
          if [ -n "$(find site -type l -print -quit)" ]; then
            echo "::error::The build made a symlink. Only static files are uploaded."
            exit 1
          fi
          unexpected=$(find site -type f \
            ! -name '*.html' ! -name '*.json' ! -name '*.md' ! -name '*.tsv' \
            ! -name '*.txt' ! -name '*.xml' ! -name '*.png' -print -quit)
          if [ -n "$unexpected" ]; then
            echo "::error::The build made an unexpected file: $unexpected. Only static files are uploaded."
            exit 1
          fi

      - name: Write security headers
        # Written by the deploy job itself (never taken from the build artifact)
        # so that a data push cannot weaken them (C7, #247). Browsers intersect
        # HTTP-header CSP with each page's <meta> script-hash CSP, adding
        # frame-ancestors protection that <meta> tags cannot enforce.
        run: |
          cat <<'EOF' > site/_headers
          /*
            Content-Security-Policy: frame-ancestors 'none'
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
            Permissions-Policy: camera=(), microphone=(), geolocation=(), interest-cohort=()
          EOF

      - name: Upload only the newest push
        # Pushes close together build at once, and their builds can finish in
        # any order. Uploads take turns (the concurrency group above), every
        # deploy job gets its turn, and a run uploads its pages only if its
        # commit is still the head of main. So an older push's pages never
        # replace a newer push's, and the run for the newest commit uploads its
        # own once its build passes. If that build fails, nothing is uploaded
        # until main builds again. The repository is public, so git reads main
        # without a credential. A read that fails fails the job, and nothing is
        # uploaded.
        id: newest
        run: |
          line=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main)
          head=${line%%[[:space:]]*}
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not uploaded: main has moved on to $head from this run's $GITHUB_SHA. The run for the newest commit on main uploads that commit's pages once its build passes."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Cloudflare Pages
        if: steps.newest.outputs.newest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # npm resolves wrangler and every package it pulls in as the registry
        # stood on the --before date, which is the tree that was checked
        # (README.md says how). No package's install script runs. Node is the
        # runner image's own.
        run: >-
          npm exec --yes --ignore-scripts --before=2026-10-29
          --package=wrangler@4.155.0 --
          wrangler pages deploy site
          --project-name=risingrepos --branch="$PAGES_BRANCH"
          --commit-hash="$GITHUB_SHA"

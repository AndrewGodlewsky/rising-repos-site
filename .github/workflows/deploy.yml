name: Build and deploy

# Every pull request and every push to main builds the pages. A push to main
# also uploads them to Cloudflare Pages.
#
# The two jobs are kept apart on purpose. The daily data push can change any
# file in this repository except a workflow, so nothing it can change may run
# in the job that holds the Cloudflare credential:
#
# - build runs the repository's code. It can only read the repository, holds
#   no secret, and hands the pages on as an artifact.
# - deploy never checks out the repository. It downloads the artifact and runs
#   a wrangler whose version is pinned below, so all it runs is named in this
#   file.
#
# tests/test_workflow.py checks each of these. README.md explains them.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  # The Cloudflare Pages branch an upload goes to. The project's production
  # branch is main, so "preview" makes a preview deployment, served at
  # https://preview.risingrepos.pages.dev, and leaves risingrepos.com as it is.
  # Going live is changing this one line to main.
  PAGES_BRANCH: preview

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The newest Python 3.14 that this version of uv installs.
      UV_PYTHON: "3.14.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Run the tests
        run: uv run --locked python -m unittest discover -s tests

      - name: Build the pages
        # Pages for any upload other than production ask search engines not
        # to index them.
        run: |
          if [ "$PAGES_BRANCH" = main ]; then
            uv run --locked python -m sitebuild dist
          else
            uv run --locked python -m sitebuild dist --noindex
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: deploy
    permissions: {}
    concurrency:
      group: cloudflare-pages-upload
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Refuse code that would run on Cloudflare
        # A _worker.js in the upload would run on Cloudflare's servers for
        # every request. The build job's code can be changed by a data push,
        # so only static files are uploaded.
        run: |
          if [ -e site/_worker.js ]; then
            echo "::error::The build made a _worker.js. Only static files are uploaded."
            exit 1
          fi

      - name: Upload only the newest push
        # The builds of two pushes run at once, and either can finish first.
        # Uploads take turns (the concurrency group above), and a run uploads
        # only while its commit is still the head of main. So an older push's
        # pages never replace a newer push's: that push's run uploads its own
        # once its build passes. If that build fails, nothing is uploaded until
        # main builds again. The repository is public, so git reads main
        # without a credential. A read that fails fails the job, and nothing is
        # uploaded.
        id: newest
        run: |
          line=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main)
          head=${line%%[[:space:]]*}
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not uploaded: main has moved on to $head from this run's $GITHUB_SHA. The run for $head uploads once its build passes."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Cloudflare Pages
        if: steps.newest.outputs.newest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # npm resolves wrangler and every package it pulls in as the registry
        # stood on the --before date, which is the tree that was checked
        # (README.md says how). No package's install script runs. Node is the
        # runner image's own.
        run: >-
          npm exec --yes --ignore-scripts --before=2026-10-29
          --package=wrangler@4.155.0 --
          wrangler pages deploy site
          --project-name=risingrepos --branch="$PAGES_BRANCH"
          --commit-hash="$GITHUB_SHA"
